# Сборка и тесты tvision-rs (workspace: tvision, tvcreator, tvtheme).
# Примеры agent-harness и qwen-agent — отдельные манифесты, в CI не входят.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            tools/tvcreator
            tools/tvtheme

      - name: cargo test --all-targets
        run: cargo test --all-targets

  test-sqlite:
    name: test (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install libsqlite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: cargo test --all-targets --features sqlite
        run: cargo test --all-targets --features sqlite

  lint:
    name: fmt & clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # После доводки clippy до нуля — включить: -- -D warnings
      - name: cargo clippy
        run: cargo clippy --all-targets --workspace