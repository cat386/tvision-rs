[package]
name = "tvcreator"
version = "0.1.0"
edition = "2021"
description = "TVCreator — дизайнер форм для tvision-rs в духе Qt Creator: файлы .tvui и генерация Rust-кода"
license = "MIT"

[dependencies]
tvision-rs = { path = "../.." }

[lib]
name = "tvcreator"
path = "src/lib.rs"

[[bin]]
name = "tvcreator"
path = "src/main.rs"

[[example]]
name = "generated_forms"
test = true
